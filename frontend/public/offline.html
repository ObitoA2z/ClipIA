<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipAI - Hors ligne</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #1a1a3a, #080812);
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      }
      main {
        width: min(560px, 92vw);
        border: 1px solid rgba(99, 102, 241, 0.35);
        background: rgba(10, 10, 30, 0.75);
        backdrop-filter: blur(12px);
        border-radius: 20px;
        padding: 24px;
      }
      h1 { margin: 0 0 12px; font-size: 1.8rem; }
      p { margin: 0 0 8px; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <h1>Tu es hors ligne</h1>
      <p>ClipAI continue de fonctionner avec le cache local.</p>
      <p>Les liens YouTube envoyes seront traites automatiquement quand la connexion revient.</p>
    </main>
  </body>
</html>
